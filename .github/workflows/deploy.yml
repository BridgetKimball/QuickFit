name: Deploy QuickFit

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Write runtime config
        env:
          FORMSPREE_ENDPOINT: ${{ secrets.FORMSPREE_ENDPOINT }}
          PHOTO_ANALYSIS_ENDPOINT: ${{ secrets.PHOTO_ANALYSIS_ENDPOINT }}
        run: |
          if [ -z "$FORMSPREE_ENDPOINT" ]; then
            echo "FORMSPREE_ENDPOINT secret is not set, the feedback page will show a not-configured message"
          fi

          if [ -z "$PHOTO_ANALYSIS_ENDPOINT" ]; then
            echo "PHOTO_ANALYSIS_ENDPOINT secret is required: it's also the base URL for weather/accounts/closet requests"
            exit 1
          fi

          mkdir -p src/scripts
          {
            printf 'window.QUICKFIT_FORMSPREE_ENDPOINT = "%s";\n' "$FORMSPREE_ENDPOINT"
            printf 'window.QUICKFIT_PHOTO_ANALYSIS_ENDPOINT = "%s";\n' "$PHOTO_ANALYSIS_ENDPOINT"
          } > src/scripts/runtime-config.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply quickfit-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
