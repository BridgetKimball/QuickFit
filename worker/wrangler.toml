name = "quickfit-photo-analysis"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Restrict CORS to your deployed QuickFit origin (e.g. "https://bridgetkimball.github.io").
# Using "*" here would let ANY website call your worker and spend your Gemini quota.
[vars]
ALLOWED_ORIGIN = "https://bridgetkimball.github.io"
GEMINI_MODEL = "gemini-flash-latest"

# Set the real secret with:
#   wrangler secret put GEMINI_API_KEY
